      {t:'下午 0.5h　18:00 发布第 00 期'},
      {t:'下午 1h　记录真实耗时（内容增量 / 厨房基线 / 拍摄附加，三笔分开记；另有一次性建设 4h 单独记）'}
    ],
    out:'产出物：已发布的第 00 期 + 一份耗时复盘',
    note:'耗时记入《耗时记录表》。第 01 期素材已在 10/6 拍完，今天的大采是为第 02 期起补库存。'
  },
  {
    id:'acc', tag:'验收', dateText:'10/8 晚', theme:'结束时的验收', pre:false,
    items:[
      '手上有一条已发布的视频（第 00 期）',
      '有真实的耗时数字：内容增量 / 厨房基线 / 拍摄附加，三笔分开记',
      '素材已备份到移动硬盘（防手机丢 / 坏）',
      '视频与简介里没有出现「孕妇 / 孕期 / 医生 / 营养」等合规词',
      '已决定 10/11（周日）18:00 发第 01 期，正式进入 12 周'
    ],
    note:'国庆的目标不是「做出好视频」，是「证明这条路走得通」。'
  }
];

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ state = {}; }

const daysEl = document.getElementById('days');

DAYS.forEach(function(day){
  const sec = document.createElement('section');
  if (day.date && day.date === TODAY) sec.classList.add('today');

  const tagCls = 'tag';
  const tagTxt = (day.date && day.date === TODAY) ? '今天' : day.tag;
  let head = '<div class="head">'
    + '<span class="' + tagCls + '">' + tagTxt + '</span>'
    + '<span class="h-title">' + day.dateText + '</span>'
    + '<span class="h-theme">' + day.theme + '</span>'
    + (day.items ? '<span class="h-count" data-count="' + day.id + '"></span>' : '')
    + '</div>';
  sec.innerHTML = head;

  if (day.rest){
    const d = document.createElement('div');
    d.className = 'rest';
    d.innerHTML = '<b>' + day.text + '</b>';
    sec.appendChild(d);
  }

  if (day.items){
    const ul = document.createElement('ul');
    day.items.forEach(function(it, i){
      const isObj = typeof it === 'object';
      const text = isObj ? it.t : it;
      const note = isObj && it.n ? it.n : '';
      const id = day.id + '-' + i;
      const li = document.createElement('li');
      const lab = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.id = id;
      const checked = (id in state) ? state[id] : !!day.pre;
      cb.checked = !!checked;
      if (cb.checked) li.classList.add('done');
      const span = document.createElement('span');
      span.className = 'txt';
      span.innerHTML = '<span class="t">' + text + '</span>' + (note ? '<span class="n">' + note + '</span>' : '');
      lab.appendChild(cb); lab.appendChild(span);
      li.appendChild(lab);
      ul.appendChild(li);
      cb.addEventListener('change', function(){
        state[id] = cb.checked;
        li.classList.toggle('done', cb.checked);
        save(); paint();
      });
      if (!(id in state) && day.pre) state[id] = true;
    });
    sec.appendChild(ul);
  }

  if (day.sub) sec.insertAdjacentHTML('beforeend', '<div class="note">' + day.sub + '</div>');
  if (day.out) sec.insertAdjacentHTML('beforeend', '<div class="note out">' + day.out + '</div>');
  if (day.warn) sec.insertAdjacentHTML('beforeend', '<div class="note warn">' + day.warn + '</div>');
  if (day.note) sec.insertAdjacentHTML('beforeend', '<div class="note">' + day.note + '</div>');

  daysEl.appendChild(sec);
});

const boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox]'));

function paint(){
  let done = 0;
  boxes.forEach(function(b){ if (b.checked) done++; });
  const total = boxes.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('barAll').style.width = pct + '%';
  document.getElementById('pctAll').textContent = pct + '%';
  document.getElementById('cntAll').textContent = done + ' / ' + total;

  DAYS.forEach(function(day){
    if (!day.items) return;
    const el = document.querySelector('[data-count="' + day.id + '"]');
    if (!el) return;
    const mine = boxes.filter(function(b){ return b.dataset.id.indexOf(day.id + '-') === 0; });
    const n = mine.filter(function(b){ return b.checked; }).length;
    el.textContent = n + ' / ' + mine.length;
    el.style.color = (n === mine.length && mine.length) ? '#0d7d76' : '';
  });
}

let timer = null;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  const hint = document.getElementById('savedHint');
  hint.textContent = '已保存';
  hint.classList.add('ok');
  clearTimeout(timer);
  timer = setTimeout(function(){ hint.textContent = ''; hint.classList.remove('ok'); }, 1600);
}

document.getElementById('reset').addEventListener('click', function(){
  if (!confirm('确定要清空全部勾选吗？此操作不可撤销。')) return;
  state = {};
  boxes.forEach(function(b){ b.checked = false; b.closest('li').classList.remove('done'); });
  save(); paint();
});

document.getElementById('print').addEventListener('click', function(){ window.print(); });

(function init(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
})();
paint();
</script>
</body>
</html>
