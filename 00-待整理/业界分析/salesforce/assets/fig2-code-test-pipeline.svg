<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8A99AB"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#032D60">图 2｜代码级测试生成的真实管线：一次生成 + 人工卡点，没有自动回环</text>
  <text x="40" y="76" font-size="15" fill="#5B6B7C">这是与“生成—运行—修复”闭环（如 Google 的 run_test 循环）最关键的结构差异。</text>

  <!-- stage 1 -->
  <rect x="40" y="110" width="240" height="250" rx="8" fill="#F7FAFD" stroke="#C9DCEF"/>
  <text x="56" y="136" font-size="14" font-weight="700" fill="#0176D3">① 输入：模型看得到什么</text>
  <rect x="56" y="150" width="208" height="42" rx="5" fill="#FFFFFF" stroke="#DCE7F2"/>
  <text x="66" y="168" font-size="12.5" fill="#1F2328">目标方法源码（光标所在方法）</text>
  <text x="66" y="184" font-size="11.5" fill="#6B7A8C">用户右键选中的那个方法</text>
  <rect x="56" y="198" width="208" height="42" rx="5" fill="#FFFFFF" stroke="#DCE7F2"/>
  <text x="66" y="216" font-size="12.5" fill="#1F2328">同类其他方法 + 类级上下文</text>
  <text x="66" y="232" font-size="11.5" fill="#6B7A8C">理解字段、依赖、调用关系</text>
  <rect x="56" y="246" width="208" height="42" rx="5" fill="#FFFFFF" stroke="#DCE7F2"/>
  <text x="66" y="264" font-size="12.5" fill="#1F2328">你手动勾选的“已有测试”</text>
  <text x="66" y="280" font-size="11.5" fill="#6B7A8C">防止重复；勾太多会超 token 预算</text>
  <rect x="56" y="294" width="208" height="42" rx="5" fill="#FFFFFF" stroke="#DCE7F2"/>
  <text x="66" y="312" font-size="12.5" fill="#1F2328">对象元数据（Dev Assistant 起）</text>
  <text x="66" y="328" font-size="11.5" fill="#6B7A8C">项目 schema / metadata 经 RAG 注入</text>

  <!-- stage 2 -->
  <rect x="320" y="150" width="200" height="170" rx="8" fill="#F7FAFD" stroke="#C9DCEF"/>
  <text x="336" y="178" font-size="14" font-weight="700" fill="#0176D3">② 上下文组装</text>
  <text x="336" y="204" font-size="12.5" fill="#1F2328">模板化 prompt：</text>
  <text x="336" y="224" font-size="12.5" fill="#5B6B7C">源码 + 上下游符号 +</text>
  <text x="336" y="244" font-size="12.5" fill="#5B6B7C">已有测试 + Apex 规范</text>
  <text x="336" y="272" font-size="12.5" fill="#1F2328">可选斜杠命令</text>
  <text x="336" y="292" font-size="12" fill="#6B7A8C">/test　生成测试</text>
  <text x="336" y="310" font-size="12" fill="#6B7A8C">/explain　/ document</text>

  <!-- stage 3 -->
  <rect x="560" y="150" width="210" height="170" rx="8" fill="#EEF6FF" stroke="#9CC3E8"/>
  <text x="576" y="178" font-size="14" font-weight="700" fill="#0176D3">③ 生成模型</text>
  <text x="576" y="204" font-size="12.5" fill="#1F2328">2024：CodeGen2.5（7B）</text>
  <text x="576" y="222" font-size="11.5" fill="#5B6B7C">Apex 微调，infill 目标</text>
  <text x="576" y="246" font-size="12.5" fill="#1F2328">2024 下半年：xGen-Code</text>
  <text x="576" y="264" font-size="11.5" fill="#5B6B7C">多轮对话 / 复杂指令</text>
  <text x="576" y="288" font-size="12" fill="#1F2328">2026：Claude+Mastra</text>
  <text x="576" y="306" font-size="11" fill="#5B6B7C">Vibes 子代理编排</text>

  <!-- stage 4 -->
  <rect x="810" y="150" width="160" height="170" rx="8" fill="#F7FAFD" stroke="#C9DCEF"/>
  <text x="826" y="178" font-size="14" font-weight="700" fill="#0176D3">④ 信任层</text>
  <text x="826" y="204" font-size="12.5" fill="#1F2328">敏感信息脱敏</text>
  <text x="826" y="226" font-size="12.5" fill="#1F2328">零数据保留</text>
  <text x="826" y="248" font-size="12.5" fill="#1F2328">毒性检测</text>
  <text x="826" y="270" font-size="12.5" fill="#1F2328">审计留痕</text>
  <text x="826" y="296" font-size="11.5" fill="#6B7A8C">客户代码不用于训练</text>

  <!-- stage 5 -->
  <rect x="1010" y="150" width="150" height="170" rx="8" fill="#FFF8EB" stroke="#F7C56B"/>
  <text x="1026" y="178" font-size="14" font-weight="700" fill="#B54708">⑤ 人工卡点</text>
  <text x="1026" y="206" font-size="12.5" fill="#1F2328">Accept 接受</text>
  <text x="1026" y="228" font-size="12.5" fill="#1F2328">Try Again 重生成</text>
  <text x="1026" y="250" font-size="12.5" fill="#1F2328">Clear 丢弃</text>
  <text x="1026" y="278" font-size="11.5" fill="#6B7A8C">人必须逐个判断，</text>
  <text x="1026" y="296" font-size="11.5" fill="#6B7A8C">没有自动评分代理</text>

  <!-- arrows -->
  <line x1="280" y1="235" x2="314" y2="235" stroke="#8A99AB" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="520" y1="235" x2="554" y2="235" stroke="#8A99AB" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="770" y1="235" x2="804" y2="235" stroke="#8A99AB" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="970" y1="235" x2="1004" y2="235" stroke="#8A99AB" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- bottom band -->
  <rect x="320" y="400" width="840" height="110" rx="8" fill="#F4F8F4" stroke="#B7D3BC"/>
  <text x="340" y="428" font-size="14" font-weight="700" fill="#0E6B3A">接受之后才发生的事（由平台完成，不由模型完成）</text>
  <rect x="340" y="442" width="180" height="52" rx="5" fill="#FFFFFF" stroke="#CFE3D2"/>
  <text x="352" y="462" font-size="12.5" fill="#1F2328">保存 / 部署到 org</text>
  <text x="352" y="481" font-size="11.5" fill="#6B7A8C">部署时默认跑全命名空间测试</text>
  <rect x="540" y="442" width="180" height="52" rx="5" fill="#FFFFFF" stroke="#CFE3D2"/>
  <text x="552" y="462" font-size="12.5" fill="#1F2328">Apex 测试框架执行</text>
  <text x="552" y="481" font-size="11.5" fill="#6B7A8C">数据回滚，不落库</text>
  <rect x="740" y="442" width="190" height="52" rx="5" fill="#FFFFFF" stroke="#CFE3D2"/>
  <text x="752" y="462" font-size="12.5" fill="#1F2328">计算覆盖率</text>
  <text x="752" y="481" font-size="11.5" fill="#6B7A8C">ApexCodeCoverage / Aggregate</text>
  <rect x="950" y="442" width="190" height="52" rx="5" fill="#FFFFFF" stroke="#CFE3D2"/>
  <text x="962" y="462" font-size="12.5" fill="#1F2328">与 75% 门槛比对</text>
  <text x="962" y="481" font-size="11.5" fill="#6B7A8C">不达标则部署失败</text>
  <line x1="522" y1="468" x2="534" y2="468" stroke="#8A99AB" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="722" y1="468" x2="734" y2="468" stroke="#8A99AB" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="932" y1="468" x2="944" y2="468" stroke="#8A99AB" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- missing loop -->
  <path d="M1085,400 C1085,368 1040,368 1040,340" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M560,400 C560,372 640,372 640,340" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="672" y="366" width="286" height="26" rx="4" fill="#FDECEA"/>
  <text x="684" y="384" font-size="12.5" fill="#C0392B">虚线 = 官方文档中不存在的自动回环</text>

  <!-- callout -->
  <rect x="40" y="400" width="250" height="110" rx="8" fill="#FDECEA" stroke="#E8A79E"/>
  <text x="56" y="426" font-size="13.5" font-weight="700" fill="#C0392B">官方明确的三条缺口</text>
  <text x="56" y="450" font-size="12" fill="#7B2A22">① 不生成测试数据</text>
  <text x="56" y="470" font-size="12" fill="#7B2A22">② 勾选过多 → 超 token 预算报错</text>
  <text x="56" y="490" font-size="12" fill="#7B2A22">③ 勾选过少 → 生成重复用例</text>

  <text x="40" y="556" font-size="13" fill="#5B6B7C">注：图中“2026：Claude + Mastra”依据 Agentforce Vibes 官方文档；该文档同时说明 Vibes 会为 Apex 与 LWC 生成测试。</text>
  <text x="40" y="578" font-size="13" fill="#5B6B7C">图的其余环节依据 Agentforce for Developers 的测试生成文档与 2024-07 官方博客；虚线为“文档未描述”，不等于“产品绝无重试机制”。</text>
</svg>
