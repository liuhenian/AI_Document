<text x="1194" y="352" class="t13">本可预知的确定性事故仍在生产上炸</text>
<text x="1194" y="380" class="s">证书到期 · 记录被误改 · 域名被劫持</text>

<!-- ============ P4 新协议盲区 ============ -->
