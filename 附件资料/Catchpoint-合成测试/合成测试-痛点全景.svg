<line x1="534" y1="192" x2="516" y2="210" class="ac2"/>
<rect x="392" y="238" width="146" height="38" rx="5" class="chip"/>
<text x="462" y="264" class="t mid">下单</text>
<line x1="516" y1="242" x2="534" y2="260" class="ac2"/>
<line x1="534" y1="242" x2="516" y2="260" class="ac2"/>

<text x="70" y="352" class="t13 act">P1</text>
<text x="104" y="352" class="t13">「通了」不等于「能用」</text>
<text x="104" y="380" class="s">Ping 通、首页 200，用户却登不进去、下不了单</text>

<!-- ============ P2 故障在别人的地盘 ============ -->
<line x1="850" y1="134" x2="850" y2="306" class="gy dt"/>
<text x="858" y="126" class="s">自己控制不了的那半条路</text>
