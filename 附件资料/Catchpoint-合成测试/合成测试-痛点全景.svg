<rect x="130" y="258" width="118" height="12" rx="3" fill="#DDE1E5"/>
<text x="200" y="284" class="s mid">全部正常 · 无告警</text>

<text x="370" y="108" class="s">用户经历的</text>
<rect x="370" y="122" width="190" height="168" rx="8" class="box"/>
<circle cx="398" cy="156" r="11" fill="none" stroke="#B6BBC1" stroke-width="1.4"/>
<rect x="392" y="188" width="146" height="38" rx="5" class="chip"/>
