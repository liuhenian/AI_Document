<text x="610" y="306" class="s">问题在供应商一侧，你这里没有探针</text>

<text x="600" y="352" class="t13 act">P2</text>
<text x="634" y="352" class="t13">故障在别人的地盘，自己最后一个知道</text>
<text x="634" y="380" class="s">供应商挂了，被骂的却是自己</text>

<!-- ============ P3 确定性事故 ============ -->
<rect x="1160" y="150" width="210" height="64" rx="8" class="box"/>
<text x="1180" y="180" class="t">SSL 证书</text>
