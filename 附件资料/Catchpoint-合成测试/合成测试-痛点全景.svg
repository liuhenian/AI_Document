<line x1="700" y1="508" x2="700" y2="820" class="ac2 dl"/>
<line x1="700" y1="508" x2="713" y2="508" class="ac2 dl"/>
<line x1="700" y1="820" x2="713" y2="820" class="ac2 dl"/>
<text x="722" y="668" class="s">没有可看的指标</text>

<text x="70" y="878" class="t13 act">P4</text>
<text x="104" y="878" class="t13">业务跑在新协议上，监控却停在首页</text>
<text x="104" y="906" class="s">起播慢 · 反复缓冲 · WS 断连 · MQTT 掉线 · 端口通但不可用</text>

