<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 920" width="1620" height="920">
<style>
.ln{fill:none;stroke:#2F3437;stroke-width:1.8;stroke-linecap:round}
.ln2{fill:none;stroke:#2F3437;stroke-width:1.6;stroke-linecap:round}
.gy{fill:none;stroke:#B6BBC1;stroke-width:1.4;stroke-linecap:round}
.gy2{fill:none;stroke:#DDE1E5;stroke-width:1.4;stroke-linecap:round}
.ac2{fill:none;stroke:#C0392B;stroke-width:1.8;stroke-linecap:round}
.box{fill:#FFFFFF;stroke:#2F3437;stroke-width:1.8}
.boxg{fill:#FFFFFF;stroke:#C9CED4;stroke-width:1.4}
.chip{fill:#FCFCFD;stroke:#C9CED4;stroke-width:1.2}
.dt{stroke-dasharray:7 6}
.dl{stroke-dasharray:5 5}
.t{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:15px;font-weight:600;fill:#22282C}
.t13{font-size:17px;font-weight:700}
.s{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:13px;font-weight:500;fill:#7F868D}
.act{fill:#C0392B}
.a11{fill:#C0392B;font-size:13px;font-weight:700}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1620" height="920" fill="#FFFFFF"/>

<!-- ======== 第一排 ======== -->

<!-- S1 Client Health 全局概览 + 指标集 -->
<text x="70" y="100" class="t13 act">S1</text>
<text x="108" y="100" class="t13">把无线体验拆成一组可查的指标</text>
<rect x="70" y="120" width="460" height="250" rx="8" class="box"/>
<text x="90" y="152" class="t">Client Health 全局概览</text>
<line x1="90" y1="166" x2="510" y2="166" class="gy2"/>
<rect x="90" y="180" width="120" height="32" rx="5" class="chip"/>
<text x="150" y="201" class="s mid">入网性能</text>
<rect x="220" y="180" width="120" height="32" rx="5" class="chip"/>
<text x="280" y="201" class="s mid">RSSI</text>
<rect x="350" y="180" width="120" height="32" rx="5" class="chip"/>
<text x="410" y="201" class="s mid">SNR</text>
<rect x="90" y="220" width="120" height="32" rx="5" class="chip"/>
<text x="150" y="241" class="s mid">漫游活动</text>
<rect x="220" y="220" width="120" height="32" rx="5" class="chip"/>
<text x="280" y="241" class="s mid">按 SSID 分布</text>
<rect x="350" y="220" width="120" height="32" rx="5" class="chip"/>
<text x="410" y="241" class="s mid">按 radio 分布</text>
<rect x="90" y="260" width="120" height="32" rx="5" class="chip"/>
<text x="150" y="281" class="s mid">数据速率</text>
<rect x="220" y="260" width="120" height="32" rx="5" class="chip"/>
<text x="280" y="281" class="s mid">物理连接状态</text>
<line x1="90" y1="316" x2="510" y2="316" class="gy2"/>
<text x="90" y="342" class="s">按站点过滤 · 最长 30 天趋势</text>
<text x="90" y="362" class="a11">「你说慢」→「该站点该 SSID 的入网性能与 RSSI 分布如何」</text>

<!-- S2 Client 360 以 MAC 为键 -->
<text x="570" y="100" class="t13 act">S2</text>
<text x="608" y="100" class="t13">把「以客户端为中心」的视图做齐</text>
<rect x="570" y="120" width="460" height="250" rx="8" class="box"/>
<text x="590" y="152" class="t">Client 360（以 MAC 为检索键）</text>
<line x1="590" y1="166" x2="1010" y2="166" class="gy2"/>
<rect x="590" y="180" width="190" height="34" rx="5" class="chip"/>
<text x="685" y="203" class="s mid">入网历史</text>
<rect x="790" y="180" width="190" height="34" rx="5" class="chip"/>
<text x="885" y="203" class="s mid">连接事件</text>
<rect x="590" y="222" width="190" height="34" rx="5" class="chip"/>
<text x="685" y="245" class="s mid">RF 指标</text>
<rect x="790" y="222" width="190" height="34" rx="5" class="chip"/>
<text x="885" y="245" class="s mid">会话详情</text>
<line x1="800" y1="280" x2="800" y2="300" class="gy"/>
<rect x="620" y="300" width="360" height="44" rx="6" class="boxg"/>
<text x="800" y="328" class="s mid">Onboarding 抓包 · 5 秒采样 · 共用同一数据面</text>
<text x="800" y="362" class="a11 mid">「看到异常」与「抓出证据」是同一条链路上的两步</text>

<!-- S3 Per-SSID Filtering -->
<text x="1070" y="100" class="t13 act">S3</text>
<text x="1108" y="100" class="t13">让业务维度成为第一筛选条件</text>
<rect x="1070" y="120" width="480" height="250" rx="8" class="box"/>
<text x="1090" y="152" class="t">Per-SSID Filtering（2.3.7）</text>
<line x1="1090" y1="166" x2="1530" y2="166" class="gy2"/>
<text x="1090" y="196" class="s">过滤前</text>
<rect x="1150" y="184" width="80" height="26" rx="4" fill="#EDEFF1" stroke="#DDE1E5"/>
<text x="1190" y="202" class="s mid">访客</text>
<rect x="1240" y="184" width="80" height="26" rx="4" fill="#EDEFF1" stroke="#DDE1E5"/>
<text x="1280" y="202" class="s mid">IoT</text>
<rect x="1330" y="184" width="80" height="26" rx="4" fill="#EDEFF1" stroke="#DDE1E5"/>
<text x="1370" y="202" class="s mid">办公</text>
<rect x="1420" y="184" width="80" height="26" rx="4" fill="#EDEFF1" stroke="#DDE1E5"/>
<text x="1460" y="202" class="s mid">访客</text>

<line x1="1310" y1="224" x2="1310" y2="244" class="gy"/>
<polygon points="1310,252 1303,238 1317,238" fill="#B6BBC1"/>

<text x="1090" y="278" class="s">过滤后</text>
<rect x="1150" y="266" width="180" height="30" rx="4" fill="#FFFFFF" stroke="#2F3437" stroke-width="1.8"/>
<text x="1240" y="286" class="t mid">生产 SSID</text>
<text x="1360" y="286" class="s">+ 按 MAC 排除测试终端</text>

<rect x="1090" y="316" width="420" height="40" rx="5" class="chip"/>
<text x="1300" y="341" class="s mid">Top Clients with Tx drops per SSID</text>
<text x="1300" y="362" class="a11 mid">不改数据，只改视角</text>

<!-- ======== 第二排 ======== -->

<!-- S4 时延三层拆解 -->
<text x="70" y="470" class="t13 act">S4</text>
<text x="108" y="470" class="t13">把时延拆到可归因的粒度</text>
<rect x="220" y="492" width="160" height="56" rx="8" class="box"/>
<text x="300" y="528" class="t mid">客户端时延</text>
<line x1="260" y1="548" x2="160" y2="590" class="ln2"/>
<line x1="300" y1="548" x2="300" y2="590" class="ln2"/>
<line x1="340" y1="548" x2="440" y2="590" class="ln2"/>
<polygon points="160,598 153,584 167,584" fill="#2F3437"/>
<polygon points="300,598 293,584 307,584" fill="#2F3437"/>
<polygon points="440,598 433,584 447,584" fill="#2F3437"/>

<rect x="90" y="600" width="140" height="64" rx="6" class="box"/>
<text x="160" y="628" class="t mid">位置</text>
<text x="160" y="650" class="s mid">→ 覆盖（第 4 组）</text>
<rect x="230" y="600" width="140" height="64" rx="6" class="box"/>
<text x="300" y="628" class="t mid">AP</text>
<text x="300" y="650" class="s mid">→ 单设备（第 3 组）</text>
<rect x="370" y="600" width="140" height="64" rx="6" class="box"/>
<text x="440" y="628" class="t mid">频段</text>
<text x="440" y="650" class="s mid">→ 频谱（第 2 组）</text>

<text x="300" y="706" class="s mid">Wireless Client Latency Insights（2.3.7）</text>
<text x="300" y="730" class="a11 mid">把前三组的结论汇总成交付物的那一层</text>

<!-- S5 新终端形态纳入监控 -->
<text x="570" y="470" class="t13 act">S5</text>
<text x="608" y="470" class="t13">把新终端形态及时纳入监控</text>
<rect x="570" y="492" width="460" height="248" rx="8" class="box"/>
<rect x="590" y="512" width="420" height="76" rx="6" class="chip"/>
<text x="610" y="542" class="t">Wi-Fi 7 客户端健康</text>
<text x="610" y="568" class="s">2.3.7.10 · Client Health Dashboard 支持 Wi-Fi 7</text>
<rect x="590" y="600" width="420" height="76" rx="6" class="chip"/>
<text x="610" y="630" class="t">MLO（多链路操作）客户端</text>
<text x="610" y="656" class="s">2.3.7.9 · 跨 2.4 / 5 / 6 GHz 连接</text>
<line x1="590" y1="694" x2="1010" y2="694" class="gy2"/>
<text x="800" y="722" class="a11 mid">Wi-Fi 7 的多链路特性让「单频段 RSSI」的解释力下降</text>

<!-- S6 可导出的报表 -->
<text x="1070" y="470" class="t13 act">S6</text>
<text x="1108" y="470" class="t13">把体验变成可导出的报表</text>
<rect x="1070" y="492" width="480" height="248" rx="8" class="box"/>
<rect x="1090" y="512" width="220" height="100" rx="6" class="chip"/>
<text x="1200" y="542" class="t mid">AP Ethernet Interface</text>
<text x="1200" y="566" class="s mid">TX Errors · RX Errors</text>
<text x="1200" y="586" class="s mid">TX Util · AP Name · AP MAC</text>
<text x="1200" y="604" class="s mid">数据覆盖 30 天</text>
<rect x="1330" y="512" width="200" height="100" rx="6" class="chip"/>
<text x="1430" y="542" class="t mid">Client / Flexible 报表</text>
<text x="1430" y="566" class="s mid">最长回溯 180 天</text>
<text x="1430" y="590" class="s mid">（3.2.2 受控可用）</text>

<line x1="1090" y1="636" x2="1530" y2="636" class="gy2"/>
<text x="1090" y="666" class="t">排障结论从截图 → 可定期产出的报表</text>
<text x="1090" y="706" class="a11">边界：30 天与 180 天两个窗口不一致，长期对账须注意</text>

<!-- ======== 底部边界 ======== -->
<text x="70" y="800" class="s">边界：</text>
<text x="120" y="800" class="s">① Client Health 趋势窗口仅 30 天，超出不留存</text>
<text x="560" y="800" class="s">② Per-SSID Filtering 是视角裁剪非数据裁剪，不降平台负载</text>
<text x="1070" y="800" class="s">③ 客户端侧问题（驱动 / 省电 / 终端策略）不在平台视野内</text>
</svg>
