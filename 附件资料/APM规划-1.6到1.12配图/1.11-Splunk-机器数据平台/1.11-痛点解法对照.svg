<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" width="1440" height="540">
<defs>
<style>
.t{fill:#22282C;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:600}
.t13{fill:#22282C;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:17px}
.t15{fill:#22282C;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:600;font-size:15px}
.s{fill:#7F868D;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:500;font-size:13px}
.a11{fill:#C0392B;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:13px}
.act{fill:#C0392B;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:17px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.lg{stroke:#7F868D;stroke-width:1.4;fill:none}
.lgd{stroke:#7F868D;stroke-width:1.4;fill:none;stroke-dasharray:6 5}
.box{fill:#FFFFFF;stroke:#C9CED4;stroke-width:1.4}
</style>
</defs>
<rect width="1440" height="540" fill="#FFFFFF"/>

<!-- 标题 -->
<text x="60" y="40" class="t13">痛点</text>
<text x="1380" y="40" class="t13 end">解法</text>
<text x="720" y="40" class="t13 mid">机制</text>

<!-- 中间分割竖线 -->
<line x1="720" y1="60" x2="720" y2="440" class="lg"/>

<!-- 左侧：2 个痛点 -->
<g transform="translate(60,180)">
  <circle cx="0" cy="0" r="6" fill="#C0392B"/>
  <text x="20" y="6" class="act">P1</text>
  <text x="60" y="6" class="t15">证据分散又不可预设 · 字段在建库时定死</text>
</g>
<g transform="translate(60,360)">
  <circle cx="0" cy="0" r="6" fill="#C0392B"/>
  <text x="20" y="6" class="act">P2</text>
  <text x="60" y="6" class="t15">查询能力只属于少数专家 · 沉淀不下来</text>
</g>

<!-- 右侧：2 个解法 -->
<g transform="translate(1380,180)">
  <circle cx="0" cy="0" r="6" fill="#C0392B"/>
  <text x="-20" y="6" class="act end">S1</text>
  <text x="-60" y="6" class="t15 end">原始事件入库 + 读时建模 + 倒排索引</text>
</g>
<g transform="translate(1380,360)">
  <circle cx="0" cy="0" r="6" fill="#C0392B"/>
  <text x="-20" y="6" class="act end">S2</text>
  <text x="-60" y="6" class="t15 end">Data Model + Pivot + Dashboard + SPL2</text>
</g>

<!-- 中间桥 -->
<g transform="translate(720,180)">
  <rect x="-140" y="-22" width="280" height="44" rx="6" class="box"/>
  <text x="0" y="-2" class="s mid">原始事件按时间 roll 成 bucket</text>
  <text x="0" y="16" class="s mid">props/transforms 读时提取字段</text>
</g>
<g transform="translate(720,360)">
  <rect x="-140" y="-22" width="280" height="44" rx="6" class="box"/>
  <text x="0" y="-2" class="s mid">语义数据模型 + 加速摘要</text>
  <text x="0" y="16" class="s mid">老手查法 → 拖拽视图 + 复用 module</text>
</g>

<!-- 连接线 -->
<line x1="380" y1="180" x2="580" y2="180" class="lg"/>
<line x1="860" y1="180" x2="1060" y2="180" class="lg"/>
<line x1="380" y1="360" x2="580" y2="360" class="lg"/>
<line x1="860" y1="360" x2="1060" y2="360" class="lg"/>

<!-- 底部说明 -->
<text x="720" y="500" class="s mid">三段式：痛点 → 机制（把痛点做成能力的那一步）→ 解法 · 完全 1:1 对应</text>

</svg>
