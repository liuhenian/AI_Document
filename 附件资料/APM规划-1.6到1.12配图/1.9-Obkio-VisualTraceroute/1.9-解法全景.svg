<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720">
<defs>
<style>
.t{fill:#22282C;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:600}
.t13{fill:#22282C;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:17px}
.t15{fill:#22282C;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:600;font-size:15px}
.s{fill:#7F868D;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:500;font-size:13px}
.a11{fill:#C0392B;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:13px}
.act{fill:#C0392B;font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;font-size:17px}
.mid{text-anchor:middle}
.end{text-anchor:end}
.ln{stroke:#22282C;stroke-width:1.6;fill:none}
.lg{stroke:#7F868D;stroke-width:1.4;fill:none}
.lgd{stroke:#7F868D;stroke-width:1.4;fill:none;stroke-dasharray:6 5}
.lrd{stroke:#C0392B;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
.lr{stroke:#C0392B;stroke-width:1.8;fill:none}
.box{fill:#FFFFFF;stroke:#C9CED4;stroke-width:1.4}
.chip{fill:#FCFCFD;stroke:#C9CED4;stroke-width:1.2}
.acb{fill:#FFFFFF;stroke:#C0392B;stroke-width:1.8}
</style>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7F868D"/></marker>
</defs>
<rect width="1600" height="720" fill="#FFFFFF"/>

<!-- ===== S1：后台常驻的短周期探测 ===== -->
<g transform="translate(80,60)">
  <text x="0" y="22" class="act">S1</text>
  <text x="42" y="22" class="t13">后台常驻的短周期探测</text>
  <!-- 时间轴：1.2 秒一个点 -->
  <g transform="translate(20,80)">
    <line x1="0" y1="60" x2="540" y2="60" class="ln"/>
    <!-- 多个采样点（密） -->
    <circle cx="20" cy="60" r="3" fill="#22282C"/>
    <circle cx="50" cy="60" r="3" fill="#22282C"/>
    <circle cx="80" cy="60" r="3" fill="#22282C"/>
    <circle cx="110" cy="60" r="3" fill="#22282C"/>
    <circle cx="140" cy="60" r="3" fill="#22282C"/>
    <circle cx="170" cy="60" r="3" fill="#22282C"/>
    <circle cx="200" cy="60" r="3" fill="#22282C"/>
    <circle cx="230" cy="60" r="3" fill="#22282C"/>
    <circle cx="260" cy="60" r="3" fill="#22282C"/>
    <circle cx="290" cy="60" r="3" fill="#22282C"/>
    <circle cx="320" cy="60" r="3" fill="#22282C"/>
    <circle cx="350" cy="60" r="3" fill="#22282C"/>
    <circle cx="380" cy="60" r="3" fill="#22282C"/>
    <circle cx="410" cy="60" r="3" fill="#22282C"/>
    <circle cx="440" cy="60" r="3" fill="#22282C"/>
    <circle cx="470" cy="60" r="3" fill="#22282C"/>
    <circle cx="500" cy="60" r="3" fill="#22282C"/>
    <circle cx="530" cy="60" r="3" fill="#22282C"/>
    <!-- 1.2 秒间隔标注 -->
    <line x1="20" y1="20" x2="50" y2="20" class="lg"/>
    <text x="35" y="14" class="s mid">1.2s</text>
    <text x="35" y="100" class="s mid">每分钟实时聚合</text>
  </g>
  <text x="0" y="200" class="t15">Monitoring Session 上自动、无间断执行</text>
  <text x="0" y="220" class="a11">把工具从「间歇」改为「连续」· 不再需要故障时人在场</text>
</g>

<!-- 分隔 -->
<line x1="660" y1="40" x2="660" y2="350" class="lgd"/>

<!-- ===== S2：结构化留存 + 长历史 ===== -->
<g transform="translate(700,60)">
  <text x="0" y="22" class="act">S2</text>
  <text x="42" y="22" class="t13">结构化留存 + 长历史</text>
  <!-- 时间轴：1 分钟粒度 -->
  <g transform="translate(20,80)">
    <line x1="0" y1="60" x2="540" y2="60" class="ln"/>
    <!-- 1 分钟一个方块 -->
    <rect x="10" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="40" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="70" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="100" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="130" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="160" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="190" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="220" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="250" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="280" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="310" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="340" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="370" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="400" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="430" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="460" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <rect x="490" y="50" width="20" height="20" fill="#FFFFFF" stroke="#22282C" stroke-width="1.4"/>
    <text x="20" y="100" class="s mid">1 分钟粒度</text>
    <text x="500" y="100" class="s end">→ 最长 6 个月</text>
  </g>
  <text x="0" y="200" class="t15">结果按 1 分钟粒度落库 · 最长保留 6 个月</text>
  <text x="0" y="220" class="a11">任意时间点回查路径与逐跳指标</text>
</g>

<!-- 分隔 -->
<line x1="1180" y1="40" x2="1180" y2="350" class="lgd"/>

<!-- ===== S3：反向路径并行采集 ===== -->
<g transform="translate(1220,60)">
  <text x="0" y="22" class="act">S3</text>
  <text x="42" y="22" class="t13">反向路径并行采集</text>
  <!-- 双向路径示意 -->
  <g transform="translate(20,80)">
    <!-- 源 -->
    <circle cx="20" cy="30" r="14" fill="#FFFFFF" stroke="#22282C" stroke-width="1.6"/>
    <text x="20" y="36" class="s mid">源</text>
    <!-- 目的 -->
    <circle cx="280" cy="30" r="14" fill="#FFFFFF" stroke="#22282C" stroke-width="1.6"/>
    <text x="280" y="36" class="s mid">目的</text>
    <!-- 去程 -->
    <line x1="34" y1="30" x2="266" y2="30" class="ln" marker-end="url(#arr)"/>
    <text x="150" y="20" class="s mid">去程</text>
    <!-- 回程：实线红（这次被采集） -->
    <path d="M266,60 C200,80 100,80 34,60" fill="none" stroke="#C0392B" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="150" y="90" class="a11 mid">回程（Reverse）</text>
  </g>
  <text x="0" y="200" class="t15">Reverse Traceroutes · Live Traceroute 双向视图</text>
  <text x="0" y="220" class="a11">⚠ 这条依赖部署</text>
</g>

</svg>
