<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 180 1440 540" width="1440" height="540">
<style>
.ln{fill:none;stroke:#2F3437;stroke-width:1.6;stroke-linecap:round}
.ln2{fill:none;stroke:#2F3437;stroke-width:1.4;stroke-linecap:round}
.gy{fill:none;stroke:#B6BBC1;stroke-width:1.2;stroke-linecap:round}
.gy2{fill:none;stroke:#DDE1E5;stroke-width:1.2;stroke-linecap:round}
.ac{fill:none;stroke:#C0392B;stroke-width:1.8;stroke-linecap:round}
.ac2{fill:none;stroke:#C0392B;stroke-width:1.4;stroke-linecap:round}
.box{fill:#FFFFFF;stroke:#2F3437;stroke-width:1.6}
.chip{fill:#FCFCFD;stroke:#C9CED4;stroke-width:1}
.dt{stroke-dasharray:6 5}
.dl{stroke-dasharray:4 4}
.hair{fill:none;stroke:#E6E9EC;stroke-width:1}
.t{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:12px;fill:#2F3437}
.t13{font-size:13px}
.s{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:11px;fill:#9AA0A6}
.ms{font-family:Consolas,Menlo,'Courier New',monospace;font-size:11px;fill:#9AA0A6}
.act{fill:#C0392B}
.iny{fill:#2F3437}
.gyf{fill:#B6BBC1}
.q{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:15px;fill:#C9CED4}
.mid{text-anchor:middle}
.end{text-anchor:end}
</style>
<rect width="1440" height="740" fill="#FFFFFF"/>

<!-- 上轨：真实发生的配置变更 -->
<text x="110" y="254" class="s">设备上真实发生的配置变更</text>
<line x1="280" y1="250" x2="1290" y2="250" class="gy2"/>
<circle cx="300" cy="250" r="4" fill="#C0392B"/>
<circle cx="560" cy="250" r="4" fill="#C0392B"/>
<circle cx="700" cy="250" r="4" fill="#C0392B"/>
<circle cx="880" cy="250" r="4" fill="#C0392B"/>
<circle cx="1010" cy="250" r="4" fill="#C0392B"/>
<circle cx="1120" cy="250" r="4" fill="#C0392B"/>
<circle cx="1220" cy="250" r="4" fill="#C0392B"/>

<!-- 下轨：留下的可退版本 -->
<text x="110" y="334" class="s">留下的可退版本</text>
<line x1="280" y1="330" x2="700" y2="330" stroke="#B6BBC1" stroke-width="1.4"/>
<line x1="700" y1="330" x2="1290" y2="330" class="gy2 dt"/>
<rect x="294" y="324" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#2F3437" stroke-width="1.4"/>
<rect x="554" y="324" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#2F3437" stroke-width="1.4"/>
<rect x="694" y="324" width="12" height="12" rx="2" fill="#FFFFFF" stroke="#2F3437" stroke-width="1.4"/>
<line x1="784" y1="324" x2="796" y2="336" class="ac2"/>
<line x1="796" y1="324" x2="784" y2="336" class="ac2"/>

<!-- 现在 -->
<line x1="1290" y1="220" x2="1290" y2="360" class="gy2 dl"/>
<text x="1290" y="210" class="s mid">现在</text>

<!-- 最近一版没有备份 -->
<line x1="1220" y1="258" x2="1220" y2="314" class="ac2 dl"/>
<rect x="1204" y="318" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#C9CED4" stroke-width="1" stroke-dasharray="5 4"/>
<text x="1220" y="336" class="s mid">?</text>

<!-- P1 -->
<text x="1060" y="392" class="t act">P1</text>
<text x="1087" y="392" class="t">想退回上一版，手里没有这一版</text>
<text x="1087" y="410" class="s">最近几次改动，一个版本都没留下</text>

<!-- P5 -->
<text x="700" y="392" class="t act">P5</text>
<text x="727" y="392" class="t">固件换了认证方式，备份静默停了</text>
<text x="727" y="410" class="s">没有报错，也没有人被告知</text>

<!-- P2：默认什么都没变 -->
<circle cx="130" cy="570" r="5" fill="#2F3437"/>
<line x1="130" y1="570" x2="250" y2="540" class="ln2"/>
<line x1="130" y1="570" x2="250" y2="570" class="ln2"/>
<line x1="130" y1="570" x2="250" y2="600" class="ln2"/>
<line x1="130" y1="570" x2="250" y2="630" class="gy2 dl"/>
<line x1="185" y1="595" x2="195" y2="605" stroke="#B6BBC1" stroke-width="1.4"/>
<line x1="195" y1="595" x2="185" y2="605" stroke="#B6BBC1" stroke-width="1.4"/>
<text x="258" y="544" class="s">链路</text>
<text x="258" y="574" class="s">终端</text>
<text x="258" y="604" class="s">应用</text>
<text x="258" y="634" class="s">配置</text>
<text x="110" y="672" class="t act">P2</text>
<text x="137" y="672" class="t">默认「什么都没变」</text>
<text x="137" y="690" class="s">配置这条线，没人走</text>

<!-- P3：举证链是断的 -->
<text x="520" y="556" class="t">谁？什么时候？改了什么？</text>
<rect x="520" y="572" width="240" height="44" rx="4" class="chip"/>
<rect x="520" y="572" width="240" height="44" rx="4" fill="none" stroke="#C9CED4" stroke-width="1" stroke-dasharray="5 4"/>
<text x="640" y="603" class="q mid">?</text>
<text x="520" y="672" class="t act">P3</text>
<text x="547" y="672" class="t">举证链是断的</text>
<text x="547" y="690" class="s">对话只能停在「各说各话」</text>

<!-- P4：备份归属错位 -->
<rect x="940" y="536" width="72" height="44" rx="4" class="box"/>
<text x="976" y="564" class="t t13 mid">R1</text>
<line x1="1012" y1="558" x2="1084" y2="558" class="gy dl"/>
<circle cx="1048" cy="558" r="8" class="ac2"/>
<line x1="1042" y1="552" x2="1054" y2="564" class="ac2"/>
<rect x="1088" y="536" width="34" height="44" rx="3" class="ln"/>
<line x1="1096" y1="554" x2="1114" y2="554" stroke="#B6BBC1" stroke-width="1.2"/>
<line x1="1096" y1="562" x2="1114" y2="562" stroke="#B6BBC1" stroke-width="1.2"/>
<text x="1105" y="600" class="s mid">R2 的配置</text>
<text x="940" y="672" class="t act">P4</text>
<text x="967" y="672" class="t">备份存在，但不知道属于谁</text>
<text x="967" y="690" class="s">你以为有退路，退路是错的</text>
</svg>
