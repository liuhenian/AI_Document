<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<style>
.cn{fill:none;stroke:#B6BBC1;stroke-width:1.3}
.t{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:12px;fill:#2F3437}
.t13{font-size:13px}
.s{font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;font-size:11px;fill:#9AA0A6}
.act{fill:#C0392B}
.end{text-anchor:end}
.mid{text-anchor:middle}
</style>
<rect width="1200" height="600" fill="#FFFFFF"/>
<text x="70" y="70" class="s">痛点</text>
<text x="1130" y="70" class="s end">解法</text>

<path d="M855,120 C700,140 480,210 300,230" class="cn"/>
<path d="M855,120 C650,160 420,300 300,340" class="cn"/>
<path d="M855,230 C700,210 480,140 300,120" class="cn"/>
<line x1="300" y1="340" x2="855" y2="340" class="cn"/>
<line x1="300" y1="450" x2="855" y2="450" class="cn"/>

<text x="70" y="125" class="t t13 act">P1</text>
<text x="104" y="125" class="t t13">修终端问题要先打断使用者</text>
<text x="104" y="145" class="s">人</text>

<text x="70" y="235" class="t t13 act">P2</text>
<text x="104" y="235" class="t t13">十步操作，没有判断价值</text>
<text x="104" y="255" class="s">时间 / 人</text>

<text x="70" y="345" class="t t13 act">P3</text>
<text x="104" y="345" class="t t13">质量取决于当班的是谁</text>
<text x="104" y="365" class="s">组织 / 质量</text>

<text x="70" y="455" class="t t13 act">P4</text>
<text x="104" y="455" class="t t13">设备侧只能登进去敲</text>
<text x="104" y="475" class="s">时间 / 人</text>

<text x="1130" y="125" class="t t13 act end">S1</text>
<text x="1094" y="125" class="t t13 end">Quick Actions 一次点击</text>

<text x="1130" y="235" class="t t13 act end">S2</text>
<text x="1094" y="235" class="t t13 end">Command Runner 不发会话</text>

<text x="1130" y="345" class="t t13 act end">S3</text>
<text x="1094" y="345" class="t t13 end">动作全量进审计日志</text>

<text x="1130" y="455" class="t t13 act end">S4</text>
<text x="1094" y="455" class="t t13 end">单行命令 + 批量作业</text>

<text x="600" y="545" class="s mid">S4 对 P4 只是替代路径 —— 网络设备侧的「一键硬动作」仍是缺口</text>
</svg>
